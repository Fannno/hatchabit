/* 分層像素 SVG：各部位共用固定關節座標，避免縮圖與不同物種的旋轉中心漂移。 */
.bit-part{transform-box:view-box;transform-origin:48px 70px}
.bit-head{transform-origin:var(--bit-head-origin)}
.bit-tail{transform-origin:var(--bit-tail-origin)}
.bit-wing-left{transform-origin:var(--bit-left-origin)}
.bit-wing-right{transform-origin:var(--bit-right-origin)}
.pet-stage:not(.sleep):not(.rest):not(.tired) .bit-tail{animation:bit-tail-sway 3.2s ease-in-out infinite}
.pet-stage:not(.sleep):not(.rest):not(.tired) [data-species="1"] .bit-tail{animation:bit-tail-wag 1.6s ease-in-out infinite}
.pet-stage:not(.sleep):not(.rest):not(.tired) .bit-wing-left{animation:bit-wing-left 4s ease-in-out infinite}
.pet-stage:not(.sleep):not(.rest):not(.tired) .bit-wing-right{animation:bit-wing-right 4s ease-in-out infinite}
.pet-stage.stroking .bit-tail{animation:bit-tail-wag 1.2s ease-in-out infinite}
.pet-stage.stroking .bit-head{animation:bit-head-nuzzle .8s ease-in-out infinite}
.pet-stage.eating .bit-head{animation:bit-head-chew .45s ease-in-out infinite}
.pet-stage.poked .bit-head{animation:bit-head-surprise .72s ease-out both}
.pet-stage.sleep .bit-part,.pet-stage.rest .bit-part{animation:none!important}
@keyframes bit-tail-sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes bit-tail-wag{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
@keyframes bit-wing-left{0%,70%,100%{transform:translateY(0)}82%,90%{transform:translateY(-1px)}}
@keyframes bit-wing-right{0%,70%,100%{transform:translateY(0)}82%,90%{transform:translateY(-1px)}}
@keyframes bit-head-nuzzle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes bit-head-chew{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}

<script>
'use strict';
// 所有平衡數值集中於此；時間單位為毫秒，狀態變化單位為每小時。
const APP_VERSION='v5.0';
const CFG={key:'hatchabit-v1',legacyKey:'pet-cottage-v1',version:1,low:25,happy:85,maxLevel:99,hour:3600000,rates:{hunger:2,mood:1,clean:1,energy:.4,intimacy:.05,healthRecover:1,healthDamage:1.2,sleep:20},personality:{greedy:1.3,playful:1.4,sleepy:1.5,neatMood:1.5,clingy:2,mischief:.3},cooldowns:{pet:30000,poke:15000,bath:180000,feed:60000,toy:60000},roomPrices:[0,1000,2500,5000,10000],daily:[50,60,70,80,90,100,150],gameEnergy:8};
const TYPES=['貓','狗','企鵝','狐狸','龍','小怪獸'];
const PERSONALITIES=[{name:'貪吃',desc:'飽食下降快 30%，餵食獲得額外親密度。'},{name:'愛玩',desc:'玩具與小遊戲的心情收益增加 40%。'},{name:'愛睡',desc:'睡眠時體力恢復速度增加 50%。'},{name:'愛乾淨',desc:'髒髒時心情下降較快，洗澡的心情收益增加 50%。'},{name:'黏人',desc:'摸摸獲得的親密度加倍。'},{name:'調皮',desc:'戳戳或玩具互動有 30% 機率觸發驚喜反應。'}];
const STATS=[['hunger','飽食度','food','#c4a06a'],['mood','心情值','smile','#d0b35f'],['clean','清潔度','bath','#83b5b4'],['energy','體力值','energy','#94ac6b'],['health','健康度','health','#c98f82'],['intimacy','親密度','heart','#c398ac']];
const ITEMS={feed:{name:'基本飼料',price:10,cat:'food',desc:'飽食 +15',effects:{hunger:15}},apple:{name:'蘋果',price:20,cat:'food',desc:'飽食 +20、健康 +2',effects:{hunger:20,health:2}},rice:{name:'飯糰',price:35,cat:'food',desc:'飽食 +30',effects:{hunger:30}},pudding:{name:'布丁',price:50,cat:'food',desc:'飽食 +15、心情 +10',effects:{hunger:15,mood:10}},cake:{name:'草莓蛋糕',price:80,cat:'food',desc:'飽食 +25、心情 +20、親密 +2',effects:{hunger:25,mood:20,intimacy:2}},potion:{name:'奇蹟特效藥',price:1500,cat:'food',desc:'特殊道具・六項狀態全部恢復至 100'},ball:{name:'繽紛皮球',price:120,cat:'toy',desc:'心情 +10、親密 +2、體力 −4'},wand:{name:'星星逗逗棒',price:240,cat:'toy',desc:'心情 +16、親密 +3、體力 −5'},bed:{name:'好夢小床',price:220,cat:'furniture',desc:'柔軟的奶油色床被，放在房間右側。'},rug:{name:'雲朵地毯',price:160,cat:'furniture',desc:'替小屋鋪上一塊柔軟的綠色地毯。'},plant:{name:'小小盆栽',price:100,cat:'furniture',desc:'窗下多一點綠意，日子也清新了。'},table:{name:'木製小桌',price:180,cat:'furniture',desc:'擺在小屋角落的迷你木桌。'},lamp:{name:'暖光立燈',price:200,cat:'furniture',desc:'一盞溫暖的燈，陪伴每個夜晚。'},doll:{name:'抱抱玩偶',price:150,cat:'furniture',desc:'把可愛的玩偶擺在床邊。'},cozy:{name:'溫馨小屋',price:0,cat:'theme',desc:'暖色牆面、木地板與柔和窗光。'},forest:{name:'森林小屋',price:1500,cat:'theme',desc:'住進綠意，讓樹木陪你呼吸。'},dessert:{name:'甜點小屋',price:2500,cat:'theme',desc:'奶油與草莓色的甜甜日常。'},star:{name:'星空小屋',price:4000,cat:'theme',desc:'在深藍色星光裡，收藏好夢。'},ocean:{name:'海洋小屋',price:6000,cat:'theme',desc:'淺藍波紋，把海風帶進房間。'}};
const ACH=[['friend','新朋友','成功孵化第一隻小 Bit'],['level','第一次升級','第一次讓小 Bit 升級'],['grow','慢慢長大','任一隻小 Bit 達到等級 10'],['adult','長大成人','任一隻小 Bit 達到等級 20'],['family','大家庭','同時擁有三隻小 Bit'],['rich','小富翁','累積獲得 5,000 金幣'],['gamer','遊戲高手','四款 Bit 遊戲各完成一局'],['designer','房間設計師','購入第一個付費房間主題']];
const GAME_NAMES={catch:'Bit 接到了！',memory:'Bit 配對趣',tap:'Bit 快閃！',snake:'Bit 吃不停！'};
const GAME_DIFFICULTIES={easy:{name:'簡單',duration:20,catchSpawn:.9,catchSpeed:[21,27],catchMove:58,tapInterval:1.15,tapBomb:.2,memoryDelay:950,snakeStep:.32},normal:{name:'普通',duration:18,catchSpawn:.7,catchSpeed:[26,33],catchMove:65,tapInterval:.85,tapBomb:.28,memoryDelay:650,snakeStep:.24},hard:{name:'困難',duration:15,catchSpawn:.5,catchSpeed:[33,42],catchMove:72,tapInterval:.62,tapBomb:.36,memoryDelay:430,snakeStep:.17}};
const GAME_STAR_REWARDS={1:15,2:30,3:50};
const clamp=(n,min=0,max=100)=>Math.min(max,Math.max(min,n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=n=>Math.floor(Math.random()*n);
const shuffled=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=pick(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const dateKey=(n=Date.now())=>{const d=new Date(n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const phase=l=>l>=20?'成年期':l>=10?'青年期':l>=5?'成長期':'幼年期';
function pendingEgg(room){return {room,stage:'choose',eggs:shuffled([0,1,2,3,4]).slice(0,3)}}
function fresh(){return {version:1,coins:0,earned:0,rooms:[{theme:'cozy',furniture:[],furnitureLayout:{},pet:null}],active:0,pending:pendingEgg(0),inventory:{},owned:['cozy'],achievements:[],games:{catch:0,memory:0,tap:0,snake:0},daily:{last:'',count:0},session:null,onboardingSeen:false,welcomeGiftGranted:false}}
function newPet(type,personality,now=Date.now()){return {name:'',type,personality,level:1,exp:0,stats:{hunger:80,mood:80,clean:85,energy:80,health:100,intimacy:20},last:now,sleep:null,rest:false,cooldowns:{},goodHours:0}}
function migrateSave(s){if(!s||typeof s!=='object')return s;const hasPet=Array.isArray(s.rooms)&&s.rooms.some(r=>r?.pet);if(typeof s.onboardingSeen!=='boolean')s.onboardingSeen=hasPet||!s.pending;if(typeof s.welcomeGiftGranted!=='boolean'){s.welcomeGiftGranted=hasPet;if(!hasPet&&s.coins===200&&s.earned===200){s.coins=0;s.earned=0}}if(!s.games||typeof s.games!=='object')s.games={catch:0,memory:0,tap:0,snake:0};for(const k of ['catch','memory','tap','snake'])if(!Number.isFinite(s.games[k]))s.games[k]=0;if(Array.isArray(s.rooms))for(const room of s.rooms){if(!room||typeof room!=='object')continue;if(!room.furnitureLayout||typeof room.furnitureLayout!=='object'||Array.isArray(room.furnitureLayout))room.furnitureLayout={};for(const id of room.furniture||[])ensureFurnitureLayout(room,id)}return s}
function isStandalone(){return window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true}
function addCoins(s,n){s.coins+=n;s.earned+=n}
function addExp(s,p,n){if(p.rest||p.level>=CFG.maxLevel)return [];p.exp+=n;const levels=[];while(p.level<CFG.maxLevel&&p.exp>=p.level*20){p.exp-=p.level*20;p.level++;const bonus=p.level>=30&&p.level%10===0?100:10;addCoins(s,bonus);levels.push(p.level)}if(p.level===CFG.maxLevel)p.exp=0;return levels}
function settle(s,now=Date.now()){
 for(const room of s.rooms){const p=room.pet;if(!p)continue;let hours=Math.max(0,now-p.last)/CFG.hour;p.last=Math.max(p.last,now);if(p.rest||hours===0)continue;
 const step=Math.max(1,hours/5000);while(hours>1e-8){const dt=Math.min(step,hours);const v=p.stats;v.hunger=clamp(v.hunger-CFG.rates.hunger*(p.personality===0?CFG.personality.greedy:1)*dt);v.clean=clamp(v.clean-CFG.rates.clean*dt);v.mood=clamp(v.mood-(CFG.rates.mood+(p.personality===3&&v.clean<CFG.low?.8:0))*dt);v.intimacy=clamp(v.intimacy-CFG.rates.intimacy*dt);const oldEnergy=v.energy;v.energy=clamp(v.energy+(p.sleep?CFG.rates.sleep*(p.personality===2?CFG.personality.sleepy:1):-CFG.rates.energy)*dt);if(p.sleep)p.sleep.recovered+=v.energy-oldEnergy;
 const good=v.hunger>=60&&v.clean>=60&&v.energy>=60;const bad=v.hunger<20||v.clean<20||v.energy<20;v.health=clamp(v.health+(good?CFG.rates.healthRecover:bad?-CFG.rates.healthDamage:0)*dt);if(good){p.goodHours+=dt;const exp=Math.floor(p.goodHours/2);if(exp){p.goodHours-=exp*2;addExp(s,p,exp)}}hours-=dt;}
 }
}
function checkAchievements(s){const ps=s.rooms.map(r=>r.pet).filter(Boolean);const cond={friend:ps.length>0,level:ps.some(p=>p.level>=2),grow:ps.some(p=>p.level>=10),adult:ps.some(p=>p.level>=20),family:ps.length>=3,rich:s.earned>=5000,gamer:Object.values(s.games).every(n=>n>0),designer:s.owned.some(id=>ITEMS[id]?.cat==='theme'&&ITEMS[id].price>0)};const added=[];for(const [id,name]of ACH)if(cond[id]&&!s.achievements.includes(id)){s.achievements.push(id);added.push(name)}return added}
function petOf(s){return s.rooms[s.active]?.pet}
function blocked(p){return !p?'請先孵化小 Bit。':p.rest?'牠正在休息，請先恢復照顧。':p.sleep?'牠正在睡覺，請先叫醒牠。':''}
function apply(p,effects){for(const [key,value]of Object.entries(effects))p.stats[key]=clamp(p.stats[key]+value)}
function ready(p,key,now=Date.now(),ms=CFG.cooldowns[key]){return p.cooldowns[key]===undefined||now-p.cooldowns[key]>=ms}
function purchase(s,id){const item=ITEMS[id];if(!item)return {error:'找不到此商品。'};if(item.cat!=='food'&&s.owned.includes(id))return {error:'已經擁有這件物品。'};if(s.coins<item.price)return {error:'金幣不足，去玩小遊戲賺取金幣吧。'};s.coins-=item.price;if(item.cat==='food')s.inventory[id]=(s.inventory[id]||0)+1;else s.owned.push(id);return {message:'已購入'+item.name+'！'}}
function feedPet(s,id,confirmed=false,now=Date.now()){const p=petOf(s),err=blocked(p);if(err)return {error:err};const item=ITEMS[id];if(!item||item.cat!=='food')return {error:'請選擇食物或道具。'};if(!(s.inventory[id]>0))return {error:'庫存不足，先到商店補貨吧。'};if(id==='potion'){if(!confirmed)return {confirm:true};s.inventory[id]--;for(const key in p.stats)p.stats[key]=100;return {message:'奇蹟發生了！所有狀態全部恢復！',effect:'spark'}}
 if(p.stats.hunger>=99.5)return {error:'牠已經吃飽了，晚點再餵吧。'};s.inventory[id]--;apply(p,item.effects);const reward=ready(p,'feed',now);let levels=[];if(reward){apply(p,{intimacy:p.personality===0?3:1});levels=addExp(s,p,4);p.cooldowns.feed=now}return {message:'吃了'+item.name+'，好滿足！'+(reward?'':'（照顧收益冷卻中）'),levels,effect:'heart'};}
function interact(s,kind,now=Date.now()){const p=petOf(s),err=blocked(p);if(err)return {error:err};if(!['pet','poke','bath'].includes(kind))return {error:'未知互動。'};if(!ready(p,kind,now)){const sec=Math.ceil((CFG.cooldowns[kind]-(now-p.cooldowns[kind]))/1000);return {message:'讓牠回味一下，'+sec+' 秒後恢復收益。',effect:kind==='bath'?'bath':'heart',cooldown:true}}p.cooldowns[kind]=now;let effects={},exp=0,message='',effect='heart';if(kind==='pet'){effects={mood:3,intimacy:p.personality===4?4:2};exp=2;message='再摸摸我嘛～'}if(kind==='poke'){effects={mood:1,intimacy:1};exp=1;message=['欸！','不要一直戳啦！','再一下～'][pick(3)];if(p.personality===5&&Math.random()<CFG.personality.mischief){effects.mood=4;message='嘿嘿，換我戳回去！'}}if(kind==='bath'){effects={clean:35,mood:p.personality===3?9:6};exp=5;effect='bath';message='洗香香，整個人都清爽了！'}apply(p,effects);return {message,levels:addExp(s,p,exp),effect}}
function playToy(s,id,now=Date.now()){const p=petOf(s),err=blocked(p);if(err)return {error:err};if(ITEMS[id]?.cat!=='toy'||!s.owned.includes(id))return {error:'請先購買這個玩具。'};if(!ready(p,'toy',now))return {error:'玩具互動還在冷卻中，稍後再玩吧。'};const cost=id==='ball'?4:5;if(p.stats.energy<cost)return {error:'體力不足，先睡個好覺吧。'};let mood=(id==='ball'?10:16)*(p.personality===1?CFG.personality.playful:1),message='和你一起玩，好開心！';if(p.personality===5&&Math.random()<CFG.personality.mischief){mood+=5;message='咻！偷偷把玩具藏起來了。'}apply(p,{mood,intimacy:id==='ball'?2:3,energy:-cost});p.cooldowns.toy=now;return {message,levels:addExp(s,p,4),effect:'spark'}}
function setSleep(s,now=Date.now()){settle(s,now);const p=petOf(s);if(!p||p.rest)return {error:'請先恢復照顧。'};if(p.sleep){const result={message:'早安！這次睡眠恢復了 '+Math.round(p.sleep.recovered)+' 點體力。'};p.sleep=null;return result}p.sleep={start:now,recovered:0};return {message:'晚安，做個好夢。體力會隨時間慢慢恢復。'}}
function setRest(s,index,now=Date.now()){settle(s,now);const p=s.rooms[index]?.pet;if(!p)return {error:'找不到小 Bit。'};p.rest=!p.rest;p.sleep=null;p.last=Math.max(p.last,now);return {message:p.rest?'已進入休息，所有數值暫時凍結。':'已恢復照顧，歡迎回來！'}}
function claimDaily(s,now=Date.now()){const today=dateKey(now);if(s.daily.last>=today)return {error:'今天已經領過獎勵了。'};const coins=CFG.daily[s.daily.count%7];s.daily.last=today;s.daily.count++;addCoins(s,coins);return {message:'今日的陪伴獎勵：'+coins+' 金幣！',coins}}
function buyRoom(s){if(s.pending)return {error:'請先完成這次孵化。'};if(s.rooms.length>=5)return {error:'已擁有五個房間。'};const price=CFG.roomPrices[s.rooms.length];if(s.coins<price)return {error:'金幣不足，先存一點迎接新朋友的基金吧。'};s.coins-=price;s.rooms.push({theme:'cozy',furniture:[],furnitureLayout:{},pet:null});s.pending=pendingEgg(s.rooms.length-1);return {message:'新房間準備好了！'}}
function selectEgg(s,idx){if(!s.pending||s.pending.stage!=='choose'||!Number.isInteger(idx)||idx<0||idx>2)return false;s.pending.selected=s.pending.eggs[idx];s.pending.type=pick(6);s.pending.personality=pick(6);s.pending.stage='hatching';return true}
function namePet(s,name,now=Date.now()){name=String(name).trim();if(name.length>16)return {error:'名字最多 16 個字。'};if(!name)name='小 Bit';if(!s.pending||s.pending.stage!=='name')return {error:'請先選擇小 Bit 的蛋。'};const first=!s.rooms.some(r=>r.pet),p=newPet(s.pending.type,s.pending.personality,now);p.name=name;s.rooms[s.pending.room].pet=p;s.active=s.pending.room;s.pending=null;let welcomeGift=false;if(first&&!s.welcomeGiftGranted){addCoins(s,200);s.welcomeGiftGranted=true;welcomeGift=true}return {message:name+'，歡迎來到 Hatchabit！',welcomeGift}}
function beginGame(s,kind,difficulty='normal',now=Date.now()){if(typeof difficulty==='number'){now=difficulty;difficulty='normal'}settle(s,now);const p=petOf(s),err=blocked(p);if(err)return {error:err};if(!Object.hasOwn(GAME_NAMES,kind))return {error:'找不到遊戲。'};if(!Object.hasOwn(GAME_DIFFICULTIES,difficulty))difficulty='normal';if(s.session)return {error:'請先結束目前遊戲。'};if(p.stats.energy<CFG.gameEnergy)return {error:'體力不足，需要至少 8 點體力。'};p.stats.energy-=CFG.gameEnergy;const ticket=now+'-'+Math.random().toString(36).slice(2);s.session={id:ticket,room:s.active,kind,difficulty};return {ticket,difficulty}}
function endGame(s,ticket,score,seconds,stars=1){if(!s.session||s.session.id!==ticket)return {error:'此局已結算或中途離開。'};const {kind,room}=s.session;s.session=null;const p=s.rooms[room].pet;score=Number.isFinite(score)?Math.max(0,score):0;seconds=Number.isFinite(seconds)?Math.max(0,seconds):0;stars=clamp(Math.round(Number(stars)||1),1,3);const coins=GAME_STAR_REWARDS[stars];addCoins(s,coins);s.games[kind]=(s.games[kind]||0)+1;apply(p,{mood:5*(p.personality===1?CFG.personality.playful:1),intimacy:1});return {coins,stars,levels:addExp(s,p,6),message:'完成'+GAME_NAMES[kind]+'，獲得 '+stars+' 星與 '+coins+' 金幣！'}}

function petClass(p){return p.rest?'rest':p.sleep?'sleep':p.stats.health<CFG.low||p.stats.energy<CFG.low||p.stats.mood<CFG.low?'tired':p.stats.mood>=CFG.happy?'happy':''}
function petDecorations(p){const v=p.stats;return p.sleep?'<span class="sleep-text">呼…</span>':p.rest?'<span class="sleep-text small">休息中</span>':`${v.hunger<CFG.low?'<div class="thought">'+icon('food')+'</div>':''}${v.clean<CFG.low?'<span class="dust">· · ·</span>':''}${v.mood>=CFG.happy?'<div class="sparkles">'+icon('heart')+'</div>':''}`}
function careHint(p){return p.rest?'休息不恢復體力，也不扣除任何狀態。':p.sleep?'這次睡了 '+duration(Date.now()-p.sleep.start)+'，恢復 '+Math.round(p.sleep.recovered)+' 點體力。':'保持飽食、清潔與體力良好，健康就會慢慢恢復。'}
function dailyNote(){return S.daily.last>=dateKey()?'今天的心意已收下，明天再來。':'今日可領 '+CFG.daily[S.daily.count%7]+' 金幣'}
function petVisualKey(p){return [p.type,p.level,p.rest,!!p.sleep,p.stats.hunger<CFG.low,p.stats.mood<CFG.low,p.stats.mood>=CFG.happy,p.stats.clean<CFG.low,p.stats.energy<CFG.low,p.stats.health<CFG.low].join('|')}
function refreshHome(){

function gamesView(){const p=petOf(S),err=blocked(p),cfg=GAME_DIFFICULTIES[gameDifficulty];const timed=cfg.duration+' 秒',reward='';const cards=[['catch','Bit 接到了！','小 Bit 頂著碗，接住從天而降的食物和金幣。',timed,reward,'<div class="row" style="gap:4px">'+art('coin')+art('apple')+'</div>'],['memory','Bit 配對趣','翻開卡片，找出六組一模一樣的小 Bit 世界圖案。','六組配對',reward,art('ball')+art('cake')],['tap','Bit 快閃！','小 Bit 出現就快點按下去，小心別碰到炸彈。',timed,reward,art('doll')+art('bomb')],['snake','Bit 吃不停！','控制小 Bit 吃掉散落的食物，越吃越長，別撞到自己。',timed,reward,'<div class="snake-preview"><i></i><i></i><i></i><b>'+art('apple')+'</b></div>']];const status=err?(p?.sleep?`<div class="info-note game-sleep-notice">${icon('moon')}<span>小 Bit 正在睡覺，請先回小屋叫醒牠再來玩^v^。</span></div>`:`<div class="info-note">${esc(err)}</div>`):`<div class="info-note">目前體力 ${Math.round(p.stats.energy)}／100。每局開始消耗 8 點體力，完成獲得經驗值 +6、心情 +5、親密 +1。${p.personality===1?'愛玩個性的心情加成為 40%。':''}</div>`;return `<div class="page"><div class="page-heading"><div class="eyebrow">Hatchabit 的遊戲時間</div><h1>Bit 遊樂場</h1><p>和小 Bit 玩幾局，賺點零用錢，也把今天的快樂存起來。</p></div>${status}<div class="difficulty-picker" role="group" aria-label="遊戲難度"><span>遊戲模式</span>${Object.entries(GAME_DIFFICULTIES).map(([id,c])=>`<button class="${gameDifficulty===id?'active':''}" data-action="difficulty" data-id="${id}" aria-pressed="${gameDifficulty===id}">${c.name}</button>`).join('')}</div><div class="game-grid bit-arcade">${cards.map(([id,name,desc,time,rewardText,visual])=>`<article class="game-card card"><div class="game-art">${visual}</div><h2>${name}</h2><p>${desc}</p><div class="game-meta"><span>${time}</span>${rewardText?`<span>${rewardText}</span>`:''}</div><button class="primary" data-action="start-game" data-id="${id}" ${err||p.stats.energy<8?'disabled':''}>${GAME_DIFFICULTIES[gameDifficulty].name}模式 ${icon('next')}</button></article>`).join('')}</div><p class="save-line">難度會調整速度與反應時間；完成後依表現獲得 1～3 星。</br>中途離開不發放完成獎勵，也不退還已消耗的體力。</p></div>`}
function petsView(){return `<div class="page"><div class="page-heading"><div class="eyebrow">每一份陪伴，都值得收藏</div><h1>我的小 Bit</h1><p>已入住 ${S.rooms.length}／5 間小屋 · 累積獲得 ${S.earned.toLocaleString()} 金幣</p></div><div class="pets-grid">${S.rooms.map((r,i)=>{const p=r.pet;return `<article class="card pet-card"><div class="pet-portrait">${petSvg(p.type,p.level,{...p.stats,sleep:p.sleep,rest:p.rest})}</div><div class="row between" style="margin:0;flex-direction:row"><span class="badge">房間 ${i+1}</span>${i===S.active?'<span class="badge">主要小 Bit</span>':''}</div><h2 style="margin:12px 0 5px">${esc(p.name)} <span class="small muted">等級 ${p.level}</span></h2><p>${TYPES[p.type]} · ${phase(p.level)} · ${PERSONALITIES[p.personality].name}</p><p>${p.rest?'休息中，數值凍結':p.sleep?'睡眠中，恢復體力':'照顧中，持續計算時間'}</p><div class="row"><button class="${i===S.active?'soft-btn':'primary'}" data-action="switch" data-index="${i}">${i===S.active?'回到小屋':'前往小屋'}</button><button class="soft-btn" data-action="rest" data-index="${i}">${p.rest?'恢復照顧':'暫時休息'}</button></div></article>`}).join('')}${S.rooms.length<5?`<article class="card room-buy">${icon('home')}<h2>再留一間小屋</h2><p>新的房間，會帶來新的相遇。<br>下一間房間 ${S.rooms.length+1}</p><button class="primary" data-action="buy-room" ${S.coins<CFG.roomPrices[S.rooms.length]?'disabled':''}>${icon('coin')}${CFG.roomPrices[S.rooms.length].toLocaleString()} 金幣解鎖</button>${S.coins<CFG.roomPrices[S.rooms.length]?'<p>還差 '+(CFG.roomPrices[S.rooms.length]-S.coins).toLocaleString()+' 金幣</p>':''}</article>`:''}</div><section class="achievements"><div class="row between"><h2>小小成就，大大紀念</h2><span class="small muted">${S.achievements.length} / 8 已完成</span></div><div class="achievement-grid">${ACH.map(([id,name,desc])=>`<article class="achievement ${S.achievements.includes(id)?'done':''}">${icon(S.achievements.includes(id)?'medal':'lock')}<h3>${name}${S.achievements.includes(id)?' · 已達成':''}</h3><p>${desc}</p></article>`).join('')}</div></section></div>`}
// 同一個 Pointer Events 狀態機：快速點一下任何小 Bit 本體是戳戳；滑動一段距離是摸摸。
let petPointer=null,homeScrollTop=0;
const GESTURE={strokeDistance:22,strokeDisplacement:12,tapTravel:8,tapDuration:550};
function inPetBody(x,y,geometry){return Number.isFinite(x)&&Number.isFinite(y)&&x>=0&&y>=0&&x<96&&y<96&&geometry.mask[Math.floor(y)*96+Math.floor(x)]===1}
function gestureResult(trace){if(trace.cancelled)return null;if(trace.stroke)return 'pet';if(trace.endInside&&trace.maxTravel<=GESTURE.tapTravel&&trace.duration<=GESTURE.tapDuration)return 'poke';return null}
function pointerPoint(event,surface){const rect=surface.getBoundingClientRect();return {x:(event.clientX-rect.left)/rect.width*96,y:(event.clientY-rect.top)/rect.height*96,px:event.clientX,py:event.clientY}}
function setPetExpression(surface,mode='normal'){
 if(!surface?.isConnected)return;const p=petOf(S);if(!p)return;
 const expression=({closed:'petting',surprised:'poke'})[mode]||mode;
 surface._faceToken=(surface._faceToken||0)+1;
 surface.dataset.expression=expression;

function gameLoop(t){if(!G||G.finished)return;const elapsed=(Date.now()-G.start)/1000,dt=Math.min(.05,(t-G.lastFrame)/1000),cfg=G.config||GAME_DIFFICULTIES.normal;G.lastFrame=t;$('game-time').textContent=G.kind==='memory'?'經過 '+Math.floor(elapsed)+' 秒':'剩餘 '+Math.max(0,Math.ceil(G.seconds-elapsed))+' 秒';if(G.kind!=='memory'&&elapsed>=G.seconds){finishGame();return}if(G.kind==='catch'){G.player=clamp(G.player+G.move*cfg.catchMove*dt,7,93);$('basket').style.left=G.player+'%';if(elapsed>=G.spawnAt){G.spawnAt=elapsed+cfg.catchSpawn;const kinds=['coin','apple','rice'],kind=kinds[pick(3)],el=document.createElement('div');el.className='falling';el.innerHTML=art(kind);$('game-board').append(el);const [min,max]=cfg.catchSpeed;G.items.push({x:8+Math.random()*84,y:-10,kind,el,speed:min+Math.random()*(max-min)})}for(let i=G.items.length-1;i>=0;i--){const item=G.items[i];item.y+=item.speed*dt;item.el.style.left=item.x+'%';item.el.style.top=item.y+'%';if(item.y>=80&&item.y<=86&&Math.abs(item.x-G.player)<9){G.score+=item.kind==='coin'?3:item.kind==='apple'?2:1;item.el.remove();G.items.splice(i,1)}else if(item.y>100){item.el.remove();G.items.splice(i,1)}}$('game-score').textContent='分數 '+G.score}

 if(G.kind==='snake'&&elapsed>=G.nextMove){G.nextMove=elapsed+cfg.snakeStep;G.dir=G.nextDir;const head=G.snake[0],next={x:head.x+G.dir.x,y:head.y+G.dir.y};if(next.x<0||next.y<0||next.x>=G.grid||next.y>=G.grid||G.snake.some(c=>c.x===next.x&&c.y===next.y)){finishGame();return}G.snake.unshift(next);if(next.x===G.food.x&&next.y===G.food.y){G.score++;G.food=snakeFoodPosition();G.foodKind=['apple','rice','pudding'][pick(3)];$('game-score').textContent='吃到 '+G.score+' 份'}else G.snake.pop();drawSnake()}

function gameStarRating(kind,score,seconds,difficulty='normal',moves=0){if(kind==='memory'){if(moves<=8&&seconds<=50)return 3;if(moves<=11&&seconds<=75)return 2;return 1}const scale=difficulty==='hard'?1.08:(difficulty==='easy'?0.9:1);if(kind==='catch'){if(score>=Math.round(20*scale))return 3;if(score>=Math.round(10*scale))return 2;return 1}if(kind==='tap'){if(score>=Math.round(20*scale))return 3;if(score>=Math.round(10*scale))return 2;return 1}if(kind==='snake'){if(score>=Math.round(5*scale))return 3;if(score>=Math.round(2*scale))return 2;return 1}return 1}

ent===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}if(G?.kind==='catch'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();G.move=e.key==='ArrowLeft'?-1:1;return}if(G?.kind==='snake'){const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();setSnakeDirection(...dirs[k])}}});document.addEventListener('keyup',e=>{if(G?.kind==='catch'&&['ArrowLeft','ArrowRight'].includes(e.key))G.move=0});window.addEventListener('blur',()=>{if(G)G.move=0;cancelPetPointer()});window.addEventListener('pagehide',()=>{if(S&&!externalChange){settle(S);persist()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick();else cancelPetPointer()});window.addEventListener('storage',e=>{if(e.key!==CFG.key||e.newValue===saveStamp||externalChange)return;externalChange=true;cancelPetPointer();document.body.classList.remove('home-mode');stopGame();if(hatchTimer){clearTimeout(hatchTimer);hatchTimer=0}closeModal();warning('另一個分頁已變更進度。為避免互相覆寫，請重新整理此頁後繼續。');$('app').innerHTML='<div class="page"><section class="card" style="padding:30px;text-align:center"><h2>進度已在另一個分頁更新</h2><p class="muted" style="margin:15px 0">重新讀取最新進度，就能繼續陪伴小 Bit。</p><button class="primary" data-action="reload">重新整理</button></section></div>';$('nav').classList.add('hidden')});setInterval(tick,10000)}
